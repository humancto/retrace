[package]
name = "retrace-desktop"
version = "0.5.0"
edition = "2024"
description = "Retrace Desktop: the Retrace engine and UI in a native window."
license = "MIT"
repository = "https://github.com/humancto/retrace"
publish = false
default-run = "Retrace"

[[bin]]
name = "Retrace"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
retrace = { path = "../..", features = ["gemma-native"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
anyhow = "1"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "signal", "time"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zip = { version = "6", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
