name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Lints are enforced on a pinned toolchain so a new clippy release cannot turn main red on its
  # own. Bump this deliberately (and run `cargo clippy` locally on it) when upgrading.
  LINT_TOOLCHAIN: "1.91.1"

jobs:
  check:
    name: fmt · clippy · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.LINT_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        # Two structural lints are allowed on purpose: the ingest config is wide, and one enum has a large variant.
        run: cargo clippy --all-targets -- -D warnings -A clippy::too_many_arguments -A clippy::large_enum_variant
      - name: test
        run: cargo test
      - name: build (release)
        run: cargo build --release
      - name: smoke (binary runs)
        run: ./target/release/retrace --help

  stable:
    name: build · test (latest stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release

  msrv:
    name: check (Rust 1.88, declared minimum)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - run: shellcheck -S warning scripts/*.sh

  python:
    name: sidecar (syntax + mock selftest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile sidecar/embed_server.py
      - run: pip install pillow
      - run: python sidecar/embed_server.py --mock --selftest
