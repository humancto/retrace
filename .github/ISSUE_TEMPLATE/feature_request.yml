name: Feature request
description: A function that Retrace must have.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The question that you want to ask your cameras, or the procedure that is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What Retrace does, from the side of the user. Add the CLI flags, the UI, or the API shape if you have an opinion.
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: The proposal agrees with the project rules
      options:
        - label: It works with no network connection (no cloud call)
          required: true
        - label: It uses only open weights and open source
          required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives that you considered
