name: Bug report
description: Something did not work the way the README says it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The three attachments that solve most bugs are the ingest log line,
        the `/api/stats` JSON and the search plan from the UI's **Plan** drawer.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you saw instead.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Exact command line
      placeholder: ./target/release/retrace --embedder siglip2-b16-256 serve --source cam=rtsp://…
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Source type
      options: [file, rtsp, hls / http, srt, youtube live, youtube video, other]
    validations:
      required: true
  - type: dropdown
    id: embedder
    attributes:
      label: Embedder
      options: [clip-b16, siglip2-b16-256, siglip2-b16-384, siglip2-so400m-384, gemma2 (sidecar), gemma2-native, other]
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS and chip, `rustc --version`, `ffmpeg -version | head -1`, Retrace version or commit.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Ingest / serve output. `RUST_LOG=debug` gives more.
      render: text
