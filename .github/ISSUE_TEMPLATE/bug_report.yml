name: Bug report
description: Retrace did not do what the README says.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Three attachments solve most bugs: the ingest log line,
        the `/api/stats` JSON, and the search plan from the **Plan** panel in the UI.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Exact command line
      placeholder: ./target/release/retrace --embedder siglip2-b16-256 serve --source cam=rtsp://…
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Source type
      options: [file, rtsp, hls / http, srt, youtube live, youtube video, other]
    validations:
      required: true
  - type: dropdown
    id: embedder
    attributes:
      label: Embedder
      options: [clip-b16, siglip2-b16-256, siglip2-b16-384, siglip2-so400m-384, gemma2 (sidecar), gemma2-native, other]
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: The OS and the chip, `rustc --version`, `ffmpeg -version | head -1`, and the Retrace version or commit.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The ingest or serve output. `RUST_LOG=debug` gives more detail.
      render: text
