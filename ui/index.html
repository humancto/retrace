<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Retrace</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%230e1319%27/%3E%3Cpath d=%27M7 23 Q12 9 17 16 T26 9%27 fill=%27none%27 stroke=%27%233fc1b9%27 stroke-width=%273%27 stroke-linecap=%27round%27/%3E%3Ccircle cx=%2726%27 cy=%279%27 r=%273%27 fill=%27%23e06b69%27/%3E%3C/svg%3E">
<style>
:root{
  --ink:#0b0f14;--panel:#111820;--panel2:#18212b;--line:#223040;--line2:#2c3b4d;
  --bone:#ece7dc;--fg:#dfe5ea;--muted:#8d99a6;--teal:#3fc1b9;--teal2:#9ae6e0;--red:#e06b69;--green:#5fc08a;--chalk:#f2d56b;--violet:#b9a7f0;
  --display:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --rail:360px;--drawer:min(560px,100vw);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--fg);font:14.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--teal2)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
.osd{font-family:var(--mono);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.wordmark{font-family:var(--display);font-weight:800;font-variation-settings:"wdth" 80;letter-spacing:.06em;font-size:18px;color:var(--bone)}
.rec::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:7px;vertical-align:0;animation:blink 1.6s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:0 18px;height:50px;background:rgba(11,15,20,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .stats{display:flex;gap:16px;flex-wrap:wrap}
.top .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill{font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:transparent;cursor:pointer;color:var(--muted)}
.pill:hover{border-color:var(--teal);color:var(--fg)}
.pill b{color:var(--chalk);font-weight:500}

/* layout */
.wrap{display:grid;grid-template-columns:minmax(0,1fr) var(--rail);min-height:calc(100vh - 50px)}
@media (max-width:1000px){.wrap{grid-template-columns:1fr}.rail{border-left:0;border-top:1px solid var(--line)}}
@media (max-width:720px){.top{height:auto;flex-wrap:wrap;gap:8px 14px;padding:8px 14px}.top .stats{order:3;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}.top .stats span{margin-right:12px}.main{padding:12px 14px 40px}}
.main{padding:16px 20px 60px;min-width:0}
.rail{border-left:1px solid var(--line);background:var(--panel);padding:14px 16px 40px;min-width:0}
h3{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px;font-weight:500;display:flex;justify-content:space-between;align-items:center}
h3:first-child{margin-top:0}

/* command bar */
.ask{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:0 12px;height:52px;transition:border-color .15s}
.ask:focus-within{border-color:var(--teal)}
.ask .caret{color:var(--teal);font-family:var(--mono);font-size:18px}
.ask input{flex:1;min-width:0;background:transparent;border:0;color:var(--bone);font:16px var(--sans);outline:none}
.ask input::placeholder{color:#5f6c79}
.ask .kbd{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.ask button.go{background:var(--teal);color:#06302e;border:0;border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer}
.ask button.go:hover{background:#5ad4cc}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 6px;align-items:center}
.filters select,.filters input{background:var(--panel);border:1px solid var(--line);color:var(--fg);padding:6px 8px;border-radius:6px;font-size:13px}
.filters label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px;align-items:center}
.chip{font-family:var(--mono);font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);cursor:pointer;background:transparent}
.chip:hover{border-color:var(--teal);color:var(--fg)}
.chip.hist{border-style:dashed}
.chips .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#5f6c79;margin-right:2px}
.plan{font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:0 0 12px;white-space:pre-wrap;display:none;max-height:260px;overflow:auto}
.plan.open{display:block}

/* timeline */
.tl{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px 8px;margin:0 0 12px;user-select:none}
.lane{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;height:30px}
.lane .nm{font-family:var(--mono);font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane .bar{position:relative;height:22px;background:var(--ink);border-radius:3px;cursor:crosshair;overflow:hidden}
.lane .bar canvas{position:absolute;inset:0;width:100%;height:100%}
.lane .bar .brush{position:absolute;top:0;bottom:0;background:rgba(242,213,107,.18);border-left:1px solid var(--chalk);border-right:1px solid var(--chalk);pointer-events:none;display:none}
.tl .axis{display:grid;grid-template-columns:96px 1fr;gap:10px;margin-top:4px}
.tl .axis div{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted)}
.tl .hint{font-family:var(--mono);font-size:10.5px;color:#5f6c79;margin-top:4px;display:flex;justify-content:space-between;gap:8px}
.tl .hint button{background:transparent;border:0;color:var(--chalk);cursor:pointer;font-family:var(--mono);font-size:10.5px;padding:0}

/* summary + results */
.summary{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 10px;min-height:18px}
.summary .n{font-family:var(--display);font-weight:700;font-size:16px;color:var(--bone);letter-spacing:-.01em;margin-right:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;min-width:0;transition:border-color .12s,transform .12s}
.card:hover,.card.sel{border-color:var(--teal)}
.card.sel{box-shadow:0 0 0 1px var(--teal)}
.card.pinned .meta .top span:first-child::before{content:"◆ ";color:var(--chalk)}
.card .img{position:relative;aspect-ratio:4/3;background:#000;overflow:hidden}
.card .img img.ctx{width:100%;height:100%;object-fit:cover;display:block}
.card .img .box{position:absolute;border:2px solid var(--teal);box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.card .img .box.vehicle{border-color:var(--chalk)}
.card .img .crop{position:absolute;right:6px;bottom:6px;width:58px;height:76px;object-fit:cover;border:1px solid var(--line2);background:#000;border-radius:2px}
.card .img .rank{position:absolute;left:6px;top:6px;font-family:var(--mono);font-size:10.5px;background:rgba(11,15,20,.8);border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--chalk)}
.card .meta{padding:8px 10px 9px;font-size:13px}
.card .meta .top{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.card .score{height:3px;background:var(--panel2);margin:6px 0}
.card .score i{display:block;height:3px;background:var(--teal)}
.card .cap{color:var(--fg);font-size:12.5px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--muted);padding:48px 0;text-align:center;font-size:15px}
.empty code{font-family:var(--mono);color:var(--fg);background:var(--panel);padding:2px 6px;border-radius:4px}
.audiohits{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin:0 0 12px}
.audiohits:empty{display:none}
.ahit{background:var(--panel);border:1px solid #3a2f5a;border-radius:8px;padding:10px 12px;min-width:0}
.ahit .top{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.ahit .top b{color:var(--violet);font-weight:500;letter-spacing:.04em}
.ahit audio{width:100%;height:32px;margin-top:8px}
.ahit .bar{height:3px;background:var(--panel2);margin:6px 0 0}
.ahit .bar i{display:block;height:3px;background:var(--violet)}

/* rail blocks */
.live img{width:100%;display:block;border-radius:6px;background:#000;aspect-ratio:4/3;object-fit:contain;cursor:zoom-in;border:1px solid var(--line)}
.live .m{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:4px}
.live select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--fg);padding:5px 8px;border-radius:6px;font-size:12.5px;margin-bottom:6px}
.feed{display:flex;flex-direction:column;gap:6px;max-height:34vh;overflow:auto}
.feed .it{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--line);padding:6px;border-radius:6px;cursor:pointer;font-size:12.5px}
.feed .it img{width:44px;height:44px;object-fit:cover;border-radius:4px;background:#000}
.feed .it.alert{border-color:var(--chalk);background:#2f2814}
.feed .it .m{font-family:var(--mono);font-size:11px;color:var(--muted)}
.feed .none,.rules .none,.case .none{color:var(--muted);font-size:13px}
.rule-form{display:grid;gap:6px}
.rule-form input,.rule-form select{background:var(--panel2);border:1px solid var(--line);color:var(--fg);padding:7px 9px;border-radius:6px;font-size:13px;width:100%}
.rule-form .row{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:6px}
.btn{background:var(--teal);color:#06302e;border:0;padding:9px 14px;font-weight:600;border-radius:6px;cursor:pointer}
.btn.sec{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
.btn.sec:hover{border-color:var(--teal)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.bt{font-family:var(--mono);font-size:12px;color:var(--teal2);margin:6px 0 8px}
.rules .r{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line)}
.rules .r small{display:block;color:var(--muted);font-family:var(--mono);font-size:11px}
.x{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:4px;cursor:pointer;padding:2px 8px}
.x:hover{border-color:var(--red);color:var(--fg)}
.case .it{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px;cursor:pointer}
.case .it img{width:44px;height:44px;object-fit:cover;border-radius:4px;background:#000}
.case .it .m{font-family:var(--mono);font-size:11px;color:var(--muted)}
.case .actions{display:flex;gap:6px;margin-top:8px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:none}
.scrim.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:var(--drawer);background:var(--panel);border-left:1px solid var(--line2);z-index:31;transform:translateX(100%);transition:transform .18s ease-out;overflow:auto;padding:14px 16px 30px}
.drawer.open{transform:none}
.drawer .head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.drawer .head .id{font-family:var(--display);font-weight:800;font-size:22px;color:var(--bone);letter-spacing:-.01em}
.drawer .head .close{margin-left:auto}
.drawer video{width:100%;background:#000;border-radius:6px;max-height:46vh;display:block}
.drawer .ctxwrap{position:relative;margin-top:10px}
.drawer .ctxwrap img{width:100%;display:block;border-radius:6px}
.drawer .ctxwrap canvas{position:absolute;inset:0;width:100%;height:100%}
.kv{font-size:13px;display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin-top:12px}
.kv b{font-family:var(--mono);font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding-top:2px}
.crops{display:flex;gap:6px;margin:10px 0}
.crops img{height:96px;border:1px solid var(--line);border-radius:4px;background:#000}
.drawer .actions{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
.more{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.more .card .img{aspect-ratio:1}
.theater img{width:100%;display:block;border-radius:6px;background:#000}

/* toast */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--chalk);color:var(--bone);padding:10px 16px;border-radius:8px;display:none;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:min(560px,92vw);font-size:14px}
.toast.show{display:block}
.toast.err{border-color:var(--red)}
@media (prefers-reduced-motion:reduce){.rec::before{animation:none}.drawer{transition:none}}
</style>
</head>
<body>

<header class="top">
  <span class="wordmark">RETRACE</span>
  <div class="stats osd">
    <span class="rec" id="s-live">live</span>
    <span id="s-cams">0 cams</span>
    <span id="s-tracklets">0 tracklets</span>
    <span id="s-model">—</span>
  </div>
  <div class="right">
    <button class="pill" id="casebtn" title="Pinned findings (p)">case <b id="casecount">0</b></button>
    <button class="pill" id="planbtn" title="Show the query plan">plan</button>
    <button class="pill" id="helpbtn" title="Keyboard shortcuts (?)">?</button>
  </div>
</header>

<div class="wrap">
  <section class="main">
    <form class="ask" id="f" autocomplete="off">
      <span class="caret">›</span>
      <input type="text" id="q" placeholder='Ask your cameras: "a person in a red jacket", "a white van", "two people walking together"' aria-label="Search">
      <span class="kbd" aria-hidden="true">/</span>
      <button class="go" type="submit">Search</button>
    </form>
    <div class="filters">
      <select id="cam" aria-label="Camera"><option value="">all cameras</option></select>
      <select id="cls" aria-label="Class"><option value="">any class</option><option>person</option><option>car</option><option>truck</option><option>bus</option><option>bicycle</option><option>motorcycle</option></select>
      <select id="dir" aria-label="Direction"><option value="">any direction</option><option value="left_to_right">left → right</option><option value="right_to_left">right → left</option><option value="toward_camera">toward camera</option><option value="away_from_camera">away from camera</option><option value="stationary">stationary</option></select>
      <select id="entry" aria-label="Entry edge"><option value="">entered anywhere</option><option value="left">entered from left</option><option value="right">entered from right</option><option value="top">entered from top</option><option value="bottom">entered from bottom</option><option value="interior">appeared inside</option></select>
      <label>dwell ≥ <input id="dwell" type="number" min="0" step="1" value="0" style="width:64px" aria-label="Minimum dwell seconds"> s</label>
      <select id="range" aria-label="Time range"><option value="">all time</option><option value="3600000">last hour</option><option value="86400000">last 24 h</option><option value="brush">selected on timeline</option></select>
    </div>
    <div class="chips" id="chips"></div>
    <div class="plan" id="plan"></div>
    <div class="tl" id="tl"></div>
    <div id="summary" class="summary osd"></div>
    <div class="audiohits" id="audio"></div>
    <div class="grid" id="grid"></div>
  </section>

  <aside class="rail">
    <div class="live" id="liveview" style="display:none">
      <h3><span class="rec">live view</span><span id="lvcount"></span></h3>
      <select id="lvcam" aria-label="Live camera"></select>
      <img id="lvimg" alt="Live preview with detections" title="Click to expand">
      <div class="m" id="lvmeta">The analysed frames, with boxes, ids, dwell and trails.</div>
    </div>
    <h3>Live feed</h3>
    <div class="feed" id="feed"><div class="none">New tracklets and alerts appear here.</div></div>
    <h3>Rules <span class="osd" id="rulecount"></span></h3>
    <form class="rule-form" id="rf">
      <input id="rtext" type="text" placeholder='e.g. "person carrying a box"' required aria-label="Rule text">
      <div class="row">
        <input id="rscore" type="number" step="0.01" min="0" max="1" value="0.27" title="Minimum score" aria-label="Minimum score">
        <input id="rdwell" type="number" step="1" min="0" value="0" title="Minimum dwell, seconds" aria-label="Minimum dwell seconds">
        <select id="rclass" aria-label="Rule class"><option value="">any class</option><option>person</option><option>car</option><option>truck</option></select>
      </div>
      <button class="btn" type="submit">Add rule and backtest</button>
    </form>
    <div class="bt" id="bt"></div>
    <div class="rules" id="rules"></div>
    <h3>Case <span class="osd" id="casemeta"></span></h3>
    <div class="case" id="case"><div class="none">Pin results to build a case. Press p on a result.</div></div>
  </aside>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Result details"></aside>
<div class="toast" id="toast" role="status"></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtT=ms=>new Date(ms).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
const fmtD=ms=>new Date(ms).toLocaleString();
const VEHICLE=new Set(['car','truck','bus','bicycle','motorcycle']);
const EXAMPLES=['a person in a red jacket','a person with a backpack','two people walking together','a white van','a person who stays near the door','a dog barking'];
let stats={},cams=[],lastHits=[],rows=[],evs=[],selected=-1,lastPlan=null,brush=null,lastQueryText='';

/* ---------- helpers ---------- */
async function api(path,opts){
  let r,j;
  try{r=await fetch(path,opts);}catch(e){throw new Error('The server did not answer. Is retrace serve running?');}
  try{j=await r.json();}catch(e){ if(!r.ok) throw new Error('HTTP '+r.status); return null; }
  if(j&&j.error) throw new Error(j.error);
  if(!r.ok) throw new Error('HTTP '+r.status);
  return j;
}
function toast(msg,err){const t=$('#toast');t.textContent=msg;t.className='toast show'+(err?' err':'');clearTimeout(toast._h);toast._h=setTimeout(()=>t.classList.remove('show'),err?6000:3500);}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}

/* ---------- stats, cameras, chips ---------- */
async function loadStats(){
  try{stats=await api('/api/stats');}catch(e){toast(e.message,true);return;}
  cams=stats.cameras||[];
  $('#s-cams').textContent=`${cams.length} cam${cams.length===1?'':'s'}`;
  $('#s-tracklets').textContent=`${stats.tracklets} tracklets · ${stats.captioned} captioned · ${stats.alerts} alerts`+(stats.audio_windows?` · ${stats.audio_windows} audio windows`:'');
  $('#s-model').textContent=`${stats.emb_model||'?'} · ${stats.emb_dim||'?'}d`;
  const live=cams.some(c=>c.kind==='live'); $('#s-live').style.display=live?'':'none';
  const sel=$('#cam');const cur=sel.value;sel.innerHTML='<option value="">all cameras</option>'+cams.map(c=>`<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('');sel.value=cur;
  await drawLanes();
  // Redraw the empty state too (its text follows the counts), but never replace results.
  const g=$('#grid');
  if(!lastHits.length&&(!g.children.length||g.querySelector(':scope > .empty.idle'))) renderEmpty();
}
function renderChips(){
  const hist=load('retrace.history',[]);
  $('#chips').innerHTML=`<span class="lbl">try</span>`+EXAMPLES.map(e=>`<button type="button" class="chip" data-q="${esc(e)}">${esc(e)}</button>`).join('')
    +(hist.length?`<span class="lbl" style="margin-left:8px">recent</span>`+hist.map(e=>`<button type="button" class="chip hist" data-q="${esc(e)}">${esc(e)}</button>`).join(''):'');
}
$('#chips').addEventListener('click',e=>{const c=e.target.closest('.chip');if(c){$('#q').value=c.dataset.q;doSearch();}});
function remember(q){let h=load('retrace.history',[]).filter(x=>x!==q);h.unshift(q);h=h.slice(0,6);store('retrace.history',h);renderChips();}

/* ---------- search ---------- */
function params(){
  const p=new URLSearchParams();
  p.set('q',$('#q').value.trim());
  for(const [id,key] of [['cam','cam'],['cls','class'],['dir','direction'],['entry','entry']]) if($('#'+id).value) p.set(key,$('#'+id).value);
  if(+$('#dwell').value>0)p.set('min_dwell_s',$('#dwell').value);
  const r=$('#range').value;
  if(r==='brush'&&brush){p.set('t0',Math.round(brush[0]));p.set('t1',Math.round(brush[1]));}
  else if(r&&r!=='brush'){p.set('t0',Date.now()-(+r));}
  p.set('k','48');
  return p;
}
function writeHash(){const p=params();p.delete('k');location.hash=p.toString();}
function readHash(){
  if(!location.hash.length) return false;
  const p=new URLSearchParams(location.hash.slice(1));
  if(!p.get('q')) return false;
  $('#q').value=p.get('q');
  $('#cam').value=p.get('cam')||'';$('#cls').value=p.get('class')||'';$('#dir').value=p.get('direction')||'';$('#entry').value=p.get('entry')||'';
  $('#dwell').value=p.get('min_dwell_s')||0;
  if(p.get('t0')&&p.get('t1')){brush=[+p.get('t0'),+p.get('t1')];$('#range').value='brush';}
  return true;
}
async function doSearch(){
  const q=$('#q').value.trim(); if(!q)return;
  const t=performance.now();
  let r;
  try{r=await api('/api/search?'+params());}catch(e){toast(e.message,true);return;}
  lastPlan=r;lastHits=r.hits||[];lastQueryText=q;selected=-1;
  remember(q);writeHash();
  $('#plan').textContent=JSON.stringify({rewritten:r.rewritten,plan:r.plan,threshold:r.threshold,timing_ms:r.timing_ms},null,2);
  const ah=r.audio_hits||[];
  $('#summary').innerHTML=`<span><span class="n">${lastHits.length}</span> of ${r.candidates} candidates</span>${ah.length?`<span style="color:var(--violet)"><span class="n" style="color:var(--violet)">${ah.length}</span> audio</span>`:''}<span>threshold ${(+r.threshold).toFixed(3)}</span><span>search ${r.timing_ms.total.toFixed(0)} ms (embed ${r.timing_ms.embed.toFixed(0)} · knn ${r.timing_ms.knn.toFixed(0)})</span><span>round trip ${(performance.now()-t).toFixed(0)} ms</span>`;
  renderAudio(ah);renderGrid(lastHits);drawLanes();
}
function renderAudio(hits){

function renderEmpty(){

/* ---------- timeline with density and brush ---------- */
async function drawLanes(){
  const el=$('#tl');if(!stats.t_min){el.innerHTML='';return;}
  let t1=stats.t_max,t0=stats.t_min;
  if(t1-t0<1000){el.innerHTML='';return;}
  try{rows=await api(`/api/tracklets?t0=${t0}&t1=${t1}&limit=3000`)||[];evs=await api(`/api/events?t0=${t0}&t1=${t1}&limit=500`)||[];}catch(e){toast(e.message,true);return;}
  const hit=new Map(lastHits.map(h=>[h.tracklet.id,h.score]));
  const byCam={};for(const r of rows){(byCam[r.cam_name]=byCam[r.cam_name]||[]).push(r);}
  const span=t1-t0;
  el.innerHTML=Object.keys(byCam).map(cam=>`<div class="lane"><div class="nm" title="${esc(cam)}">${esc(cam)}</div><div class="bar" data-cam="${esc(cam)}"><canvas></canvas><div class="brush"></div></div></div>`).join('')
    +`<div class="axis"><div></div><div><span>${fmtD(t0)}</span><span>${rows.length} tracklets · ${((t1-t0)/60000).toFixed(0)} min</span><span>${fmtD(t1)}</span></div></div>
     <div class="hint"><span>drag on a lane to select a time range · click a bar to open the tracklet</span><span>${brush?`<button type="button" id="clearbrush">clear selection ${fmtT(brush[0])}–${fmtT(brush[1])}</button>`:''}</span></div>`;
  for(const bar of el.querySelectorAll('.bar')){
    const cam=bar.dataset.cam,rs=byCam[cam],c=bar.querySelector('canvas');
    const W=bar.clientWidth||600,H=22;c.width=W*2;c.height=H*2;const x=c.getContext('2d');x.scale(2,2);
    const N=Math.max(40,Math.min(240,Math.floor(W/4)));const dens=new Array(N).fill(0);
    for(const r of rs){const a=Math.floor((r.t0-t0)/span*N),b=Math.max(a,Math.floor((r.t1-t0)/span*N));for(let i=Math.max(0,a);i<=Math.min(N-1,b);i++)dens[i]++;}
    const mx=Math.max(1,...dens);
    for(let i=0;i<N;i++){if(!dens[i])continue;x.fillStyle=`rgba(63,193,185,${0.15+0.55*dens[i]/mx})`;x.fillRect(i*W/N,H-2-Math.max(3,(H-4)*dens[i]/mx),W/N,Math.max(3,(H-4)*dens[i]/mx));}
    for(const r of rs){if(!hit.has(r.id))continue;const xa=(r.t0-t0)/span*W,w=Math.max(2,(r.t1-r.t0)/span*W);x.fillStyle=VEHICLE.has(r.class)?'#f2d56b':'#ffffff';x.fillRect(xa,2,w,4);}
    for(const e of evs){if(e.cam&&!cams.find(cc=>cc.id===e.cam&&cc.name===cam))continue;x.fillStyle='#e06b69';x.fillRect((e.ts-t0)/span*W,0,2,H);}
    if(brush){const b=bar.querySelector('.brush');b.style.display='block';b.style.left=((brush[0]-t0)/span*100)+'%';b.style.width=((brush[1]-brush[0])/span*100)+'%';}
    let down=null;
    bar.addEventListener('mousedown',ev=>{down=ev.clientX;ev.preventDefault();});
    bar.addEventListener('mousemove',ev=>{if(down===null)return;const r=bar.getBoundingClientRect();const a=Math.min(down,ev.clientX)-r.left,b=Math.max(down,ev.clientX)-r.left;const bb=bar.querySelector('.brush');bb.style.display='block';bb.style.left=(a/r.width*100)+'%';bb.style.width=((b-a)/r.width*100)+'%';});
    bar.addEventListener('mouseup',ev=>{if(down===null)return;const r=bar.getBoundingClientRect();const a=Math.min(down,ev.clientX),b=Math.max(down,ev.clientX);down=null;
      if(b-a<4){ // click: open the nearest tracklet at that time
        const tt=t0+(a-r.left)/r.width*span;const near=rs.filter(q=>q.t0<=tt&&q.t1>=tt).sort((p,q)=>(p.t1-p.t0)-(q.t1-q.t0))[0]||rs.sort((p,q)=>Math.abs(p.t0-tt)-Math.abs(q.t0-tt))[0];if(near)openTracklet(near.id);return;}
      brush=[t0+(a-r.left)/r.width*span,t0+(b-r.left)/r.width*span];$('#range').value='brush';
      if($('#q').value.trim())doSearch();else listRange();
    });
  }
  const cb=$('#clearbrush');if(cb)cb.onclick=()=>{brush=null;$('#range').value='';if($('#q').value.trim())doSearch();else{lastHits=[];renderEmpty();drawLanes();}};
}
async function listRange(){
  if(!brush)return;
  const camq=$('#cam').value?`&cam=${encodeURIComponent($('#cam').value)}`:'';
  let rs;try{rs=await api(`/api/tracklets?t0=${Math.round(brush[0])}&t1=${Math.round(brush[1])}&limit=96${camq}`)||[];}catch(e){toast(e.message,true);return;}
  lastHits=rs.map(t=>({tracklet:t,score:0}));
  $('#summary').innerHTML=`<span><span class="n">${rs.length}</span> tracklets between ${fmtT(brush[0])} and ${fmtT(brush[1])}</span>`;
  renderAudio([]);renderGrid(lastHits.map(h=>({...h,score:1})));drawLanes();
}

    $('#more').innerHTML=r.hits.map(h=>`<div class="card" data-id="${h.tracklet.id}"><div class="img"><img src="/thumb/${h.tracklet.id}" alt=""></div><div class="meta"><div class="top"><span>${esc(h.tracklet.cam_name)}</span><span>${(+h.score).toFixed(2)}</span></div></div></div>`).join('')||'<div class="none" style="color:var(--muted)">No similar tracklet.</div>';

function togglePin(t,q){let c=getCase();if(c.some(x=>x.id===t.id)){c=c.filter(x=>x.id!==t.id);toast(`#${t.id} removed from the case.`);}else{c.unshift({id:t.id,cam:t.cam_name,class:t.class,t0:t.t0,t1:t.t1,dwell_s:t.dwell_s,query:q||'',added:new Date().toISOString()});toast(`#${t.id} pinned to the case.`);}store('retrace.case',c);renderCase();if(lastHits.length)renderGrid(lastHits);}

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if(e.key==='Escape'){closeDrawer();if(typing)document.activeElement.blur();return;}
  if(typing)return;
  if(e.key==='/'){e.preventDefault();$('#q').focus();$('#q').select();return;}
  if(e.key==='?'){toast('/ search · j k move · enter open · p pin · esc close · drag the timeline to select a time');return;}
  const cards=[...$('#grid').querySelectorAll('.card')];if(!cards.length)return;
  if(e.key==='j'||e.key==='k'){selected=Math.max(0,Math.min(cards.length-1,selected+(e.key==='j'?1:-1)));cards.forEach(c=>c.classList.remove('sel'));cards[selected].classList.add('sel');cards[selected].scrollIntoView({block:'nearest'});cards[selected].focus({preventScroll:true});return;}
  if(e.key==='Enter'&&selected>=0){openTracklet(+cards[selected].dataset.id);return;}
  if(e.key==='p'&&selected>=0){const h=lastHits[+cards[selected].dataset.i];if(h)togglePin(h.tracklet,lastQueryText);return;}
});

  d.innerHTML=`<div class="head"><span class="id">${esc(cam)}</span><span class="osd rec">live view</span><button class="btn sec sm close" id="closebtn">close · esc</button></div><img id="theater" src="/live.mjpeg?cam=${encodeURIComponent(cam)}&_=${Date.now()}" alt="Live view">`;
  $('#closebtn').onclick=closeDrawer;});

renderChips();renderCase();
loadStats().then(()=>{if(readHash()){doSearch().then(()=>{const p=new URLSearchParams(location.hash.slice(1));if(p.get('open'))openTracklet(+p.get('open'));});}});
loadRules();connectLive();loadLiveCams();
setInterval(loadStats,15000);setInterval(loadLiveCams,5000);
